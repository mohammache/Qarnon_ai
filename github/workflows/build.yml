name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: تحميل الكود
        uses: actions/checkout@v4

      - name: تثبيت Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: تثبيت Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: تفعيل Yarn
        run: |
          corepack enable
          yarn --version

      - name: تثبيت المكتبات
        run: yarn install

      - name: إعطاء صلاحية Gradle
        run: chmod +x android/gradlew

      - name: بناء APK
        run: cd android && ./gradlew assembleDebug

      - name: حفظ APK
        uses: actions/upload-artifact@v4
        with:
          name: qarnonai-apk
          path: android/app/build/outputs/apk/debug/*.apk
